[project]
name = "muninn-cli"
version = "0.1.0"
description = "Muninn - The Extensible Reciting CLI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Alfred", email = "your@email.com" }
]
keywords = ["cli", "recite", "memorize", "flashcard"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = []

[project.scripts]
muninn = "src.main:main"

[project.urls]
Repository = "https://github.com/a1fredbao/muninn"
Issues = "https://github.com/a1fredbao/muninn/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
