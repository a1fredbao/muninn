[project]
name = "muninn"
version = "0.1.0"
description = "Muninn - The Extensible Reciting CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
muninn = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
